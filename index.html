<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --ink:#1B1B16;
    --parchment:#F5F0E4;
    --parchment-dim:#EDE6D4;
    --racing:#1F3B33;
    --racing-light:#2C5044;
    --racing-dark:#152B25;
    --brass:#B08D57;
    --brass-light:#D8BD8A;
    --terracotta:#B0492E;
    --sage:#5C7A5A;
    --line:#D9D0BC;
    --line-dark:#3E5951;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--parchment);
    color:var(--ink);
    display:flex;
    min-height:100vh;
    font-size:14px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  ::selection{background:var(--brass-light);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:232px;
    flex-shrink:0;
    background:var(--racing);
    color:var(--parchment);
    display:flex;
    flex-direction:column;
    padding:28px 0 18px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 22px 22px;
    border-bottom:1px solid rgba(245,240,228,0.15);
    margin-bottom:14px;
  }
  .brand .mark{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:700;
    color:var(--brass-light);
    line-height:1.15;
  }
  .brand .sub{
    font-size:11px;
    letter-spacing:0.04em;
    color:rgba(245,240,228,0.55);
    margin-top:4px;
  }
  nav{flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 22px;
    cursor:pointer;
    color:rgba(245,240,228,0.75);
    font-size:13.5px;
    border-left:3px solid transparent;
    transition:background .15s, color .15s, border-color .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05);color:var(--parchment);}
  .nav-item.active{
    background:var(--racing-light);
    color:var(--white);
    border-left-color:var(--brass);
  }
  .nav-count{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(245,240,228,0.45);
  }
  .sidebar-footer{
    padding:14px 22px 0;
    border-top:1px solid rgba(245,240,228,0.15);
    font-size:11px;
    color:rgba(245,240,228,0.4);
    line-height:1.5;
  }

  /* ---------- MAIN ---------- */
  main{flex:1;padding:34px 42px 60px;max-width:1280px;}
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:22px;
    gap:20px;
    flex-wrap:wrap;
  }
  .page-head h1{font-size:28px;color:var(--racing-dark);}
  .page-head .desc{color:#6b6a5e;font-size:13px;margin-top:5px;max-width:520px;}
  .actions{display:flex;gap:10px;align-items:center;}

  input[type=text], input[type=search], input[type=number], input[type=date], select, textarea{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:3px;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}

  .btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid var(--racing);
    background:var(--racing);
    color:var(--white);
    cursor:pointer;
    transition:background .15s, transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--racing-light);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{
    background:transparent;
    color:var(--racing);
    border-color:var(--line-dark);
  }
  .btn.secondary:hover{background:rgba(31,59,51,0.06);}
  .btn.danger{background:transparent;border-color:var(--terracotta);color:var(--terracotta);}
  .btn.danger:hover{background:rgba(176,73,46,0.08);}
  .btn.small{padding:5px 10px;font-size:12px;}

  /* ---------- DASHBOARD ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:30px;
  }
  .stat-card{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--brass);
    padding:16px 18px;
    border-radius:3px;
  }
  .stat-card .num{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    color:var(--racing-dark);
    line-height:1.1;
  }
  .stat-card .lbl{
    font-size:12px;
    color:#6b6a5e;
    margin-top:6px;
  }
  .panel-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:10px;
  }
  @media (max-width:900px){.panel-grid{grid-template-columns:1fr;}}
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:3px;
    padding:18px 20px;
  }
  .panel h3{font-size:15px;margin-bottom:12px;color:var(--racing-dark);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-row .bar-label{width:140px;flex-shrink:0;color:#4b4a40;}
  .bar-track{flex:1;background:var(--parchment-dim);border-radius:2px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--brass);}
  .bar-fill.green{background:var(--sage);}
  .bar-fill.rust{background:var(--terracotta);}
  .bar-count{width:26px;text-align:right;font-family:'IBM Plex Mono',monospace;color:#6b6a5e;}

  /* ---------- TABLE ---------- */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
    align-items:center;
  }
  .toolbar select{min-width:150px;}
  .table-wrap{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:3px;
    overflow-x:auto;
  }
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px;}
  thead th{
    text-align:left;
    padding:11px 14px;
    background:var(--parchment-dim);
    color:var(--racing-dark);
    font-weight:600;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    position:sticky;top:0;
  }
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    color:var(--ink);
    white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(176,141,87,0.06);}
  .row-actions{display:flex;gap:6px;}
  .empty-state{padding:50px 20px;text-align:center;color:#8b8a7c;}
  .empty-state .big{font-family:'Fraunces',serif;font-size:18px;color:var(--racing-dark);margin-bottom:6px;}

  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:500;
    border:1px solid transparent;
  }
  .pill.status-available, .pill.status-accepted, .pill.status-approved, .pill.status-interested, .pill.status-complete{
    background:rgba(92,122,90,0.14); color:var(--sage); border-color:rgba(92,122,90,0.3);
  }
  .pill.status-underoffer, .pill.status-process{
    background:rgba(176,141,87,0.16); color:#8a6a30; border-color:rgba(176,141,87,0.4);
  }
  .pill.status-sold{
    background:rgba(31,59,51,0.12); color:var(--racing); border-color:rgba(31,59,51,0.3);
  }
  .pill.status-rejected, .pill.status-notinterested{
    background:rgba(176,73,46,0.12); color:var(--terracotta); border-color:rgba(176,73,46,0.3);
  }
  .pill.status-default{background:var(--parchment-dim);color:#6b6a5e;border-color:var(--line);}

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(21,20,15,0.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:50px 20px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--white);
    border-radius:4px;
    width:100%;max-width:520px;
    padding:26px 28px 24px;
    border:1px solid var(--line);
  }
  .modal h2{font-size:20px;color:var(--racing-dark);margin-bottom:4px;}
  .modal .modal-sub{font-size:12px;color:#8b8a7c;margin-bottom:18px;}
  .field{margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:500;color:#4b4a40;}
  .field input, .field select, .field textarea{width:100%;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .modal-danger-note{font-size:12.5px;color:#6b6a5e;margin-bottom:18px;line-height:1.5;}

  .toast{
    position:fixed;bottom:24px;right:24px;
    background:var(--racing-dark);color:var(--parchment);
    padding:11px 18px;border-radius:4px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    z-index:100;
    opacity:0;transform:translateY(8px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .storage-note{font-size:11px;color:#8b8a7c;margin-top:2px;}
  .loading-row td{color:#8b8a7c;font-style:italic;}
</style>
</head>

/* ============================================================
   STATE + STORAGE
   ============================================================ */
let DATA = JSON.parse(JSON.stringify(SEED)); // in-memory copy of all entity arrays; seeded immediately so first paint never crashes
let activeSection = 'dashboard';
let searchTerm = '';
let filterValue = '';
const STORAGE_KEY = 'agentsociety:data:v1';

async function loadData(){
  if(!window.storage){ return; } // no storage in this context — keep the in-memory seed
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      // make sure any newly-added entity keys exist even on old saved data
      Object.keys(SEED).forEach(k=>{ if(!loaded[k]) loaded[k] = SEED[k]; });
      DATA = loaded;
      return;
    }
  }catch(e){ /* no saved record yet — keep the in-memory seed */ }
  try{ await saveData(); }catch(e){ /* ignore */ }
}

let saveTimer = null;
async function saveData(){
  if(!window.storage) return;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
  }catch(e){
    console.error('Storage error', e);
    showToast('Could not save — your last change may not persist.');
  }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 150);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   HELPERS
   ============================================================ */
function nextId(entityKey){
  const cfg = ENTITIES[entityKey];
  const arr = DATA[entityKey];
  let maxN = 0;
  arr.forEach(row=>{
    const m = String(row.id).match(/(\d+)$/);
    if(m) maxN = Math.max(maxN, parseInt(m[1],10));
  });
  const n = maxN + 1;
  return cfg.idPrefix + String(n).padStart(3,'0');
}
function clientName(id){
  const c = DATA.clients.find(x=>x.id===id);
  return c ? c.fullname : id || '—';
}
function propertyAddr(id){
  const p = DATA.properties.find(x=>x.id===id);
  return p ? p.address : id || '—';
}
function money(n){
  if(n===undefined||n===null||n==='') return '—';
  return '£' + Number(n).toLocaleString('en-GB', {maximumFractionDigits:2});
}
function pct(n){
  if(n===undefined||n===null||n==='') return '—';
  return (Number(n)*100).toFixed(1) + '%';
}
function dateFmt(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
}
function slug(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function statusPillClass(s){
  const key = slug(s);
  const known = ['available','underoffer','sold','accepted','process','rejected','complete','interested','notinterested','approved'];
  return known.includes(key) ? 'status-'+key : 'status-default';
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = SECTIONS.map(s=>{
    const count = s.key==='dashboard' ? '' : `<span class="nav-count">${DATA[s.key].length}</span>`;
    return `<div class="nav-item ${activeSection===s.key?'active':''}" data-section="${s.key}">
      <span>${s.icon}</span><span>${s.label}</span>${count}

  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeSection = el.dataset.section;
      searchTerm=''; filterValue='';
      renderNav();
      renderApp();
    });
  });
}

/* ============================================================
   RENDER: DASHBOARD
   ============================================================ */
function renderDashboard(){
  const clients = DATA.clients, properties = DATA.properties, viewings = DATA.viewings,
        offers = DATA.offers, finances = DATA.finances, transactions = DATA.transactions;

  const propByStatus = {};
  properties.forEach(p=>{ const k=p.status||'Unknown'; propByStatus[k]=(propByStatus[k]||0)+1; });
  const offerByStatus = {};
  offers.forEach(o=>{ const k=o.status||'Unknown'; offerByStatus[k]=(offerByStatus[k]||0)+1; });
  const clientByStatus = {};
  clients.forEach(c=>{ const k=c.status||'Unknown'; clientByStatus[k]=(clientByStatus[k]||0)+1; });
  const interestedViewings = viewings.filter(v=>v.outcome==='Interested').length;
  const financeApproved = finances.filter(f=>f.approvalStatus==='Accepted').length;
  const totalTxValue = transactions.reduce((s,t)=>s+Number(t.amount||0),0);

  const stats = [
    ['Total clients', clients.length],
    ['Total properties', properties.length],
    ['Properties available', properties.filter(p=>p.status==='Available').length],
    ['Properties under offer', properties.filter(p=>slug(p.status)==='underoffer').length],
    ['Properties sold', properties.filter(p=>p.status==='Sold').length],
    ['Total viewings', viewings.length],
    ['Interested (viewings)', interestedViewings],
    ['Total offers', offers.length],
    ['Offers accepted', offers.filter(o=>o.status==='Accepted').length],
    ['Finance applications', finances.length],
    ['Finance approved', financeApproved],
    ['Total transaction value', money(totalTxValue)],
  ];

  function barBlock(title, dataObj, colorClass){
    const max = Math.max(1, ...Object.values(dataObj));
    const rows = Object.entries(dataObj).map(([k,v])=>`
      <div class="bar-row">
        <div class="bar-label">${esc(k)}</div>
        <div class="bar-track"><div class="bar-fill ${colorClass}" style="width:${(v/max*100).toFixed(0)}%"></div></div>
        <div class="bar-count">${v}</div>
      </div>`).join('');
    return `<div class="panel"><h3>${title}</h3>${rows || '<div class="empty-state">No data yet</div>'}</div>`;
  }

  return `
    <div class="page-head">
      <div>
        <h1>Dashboard</h1>
        <div class="desc">Live summary of clients, properties, viewings, offers, financing and transactions.</div>
      </div>
    </div>
    <div class="stat-grid">
      ${stats.map(([lbl,num])=>`<div class="stat-card"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('')}
    </div>
    <div class="panel-grid">
      ${barBlock('Property status breakdown', propByStatus, 'green')}
      ${barBlock('Client type breakdown', clientByStatus, '')}
      ${barBlock('Offer status breakdown', offerByStatus, 'rust')}
    </div>
  `;
}

/* ============================================================
   RENDER: GENERIC TABLE SECTION
   ============================================================ */
function refValue(field, row){
  const val = row[field.key];
  if(field.type==='ref'){
    return field.ref==='clients' ? clientName(val) : propertyAddr(val);
  }
  return val;
}
function cellDisplay(field, row){
  const raw = row[field.key];
  if(field.type==='ref') return esc(refValue(field,row)) + ` <span style="color:#a19f8e;font-size:11px;">(${esc(raw||'—')})</span>`;
  if(field.key==='date' || field.key==='listingDate' || field.key==='dateIssued' || field.key==='expiryDate') return esc(dateFmt(raw));
  if(field.percent) return esc(pct(raw));
  if(['price','amount','loanAmount','monthlyPayment','serviceCharge','rent','maintenanceCost','insuranceCost','annualCost'].includes(field.key)) return esc(money(raw));
  if(field.key==='status' || field.key==='approvalStatus' || field.key==='outcome'){
    return `<span class="pill ${statusPillClass(raw)}">${esc(raw||'—')}</span>`;
  }
  return esc(raw===undefined||raw===null||raw===''? '—' : raw);
}

function renderTableSection(entityKey){
  const cfg = ENTITIES[entityKey];
  let rows = DATA[entityKey];

  // search
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    rows = rows.filter(r=>{
      return cfg.columns.some(colKey=>{
        const f = cfg.fields.find(f=>f.key===colKey);
        const val = f && f.type==='ref' ? refValue(f,r) : r[colKey];
        return String(val||'').toLowerCase().includes(t);
      });
    });
  }
  // status filter (uses field named status/approvalStatus/outcome if present)
  const filterField = cfg.fields.find(f=>['status','approvalStatus','outcome'].includes(f.key));
  if(filterField && filterValue){
    rows = rows.filter(r=>r[filterField.key]===filterValue);
  }

  const head = cfg.columns.map(colKey=>{
    const f = cfg.fields.find(f=>f.key===colKey);
    return `<th>${esc(f.label)}</th>`;
  }).join('') + '<th></th>';

  const body = rows.length ? rows.map(r=>{
    const tds = cfg.columns.map(colKey=>{
      const f = cfg.fields.find(f=>f.key===colKey);
      return `<td>${cellDisplay(f,r)}</td>`;
    }).join('');
    return `<tr>
      ${tds}
      <td class="row-actions">
        <button class="btn secondary small" data-edit="${r.id}">Edit</button>
        <button class="btn danger small" data-del="${r.id}">Delete</button>
      </td>
    </tr>`;
  }).join('') : `<tr><td colspan="${cfg.columns.length+1}"><div class="empty-state"><div class="big">Nothing here yet</div>Add the first ${cfg.label.toLowerCase()} to get started.</div></td></tr>`;

  const filterOptions = filterField ? [...new Set(DATA[entityKey].map(r=>r[filterField.key]).filter(Boolean))] : [];

  return `
    <div class="page-head">
      <div>
        <h1>${cfg.plural}</h1>
        <div class="desc">${rows.length} of ${DATA[entityKey].length} record${DATA[entityKey].length===1?'':'s'} shown.</div>
      </div>
      <div class="actions">
        <button class="btn" id="addBtn">+ Add ${cfg.label}</button>
      </div>
    </div>
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search ${cfg.plural.toLowerCase()}..." value="${esc(searchTerm)}">
      ${filterField ? `<select id="filterSelect">
        <option value="">All ${filterField.label.replace(':','')}</option>
        ${filterOptions.map(o=>`<option value="${esc(o)}" ${filterValue===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>` : ''}
    </div>
    <div class="table-wrap">
      <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    </div>
  `;
}

function openModal(entityKey, existingId){
  const cfg = ENTITIES[entityKey];
  const row = existingId ? DATA[entityKey].find(r=>r.id===existingId) : null;
  const isEdit = !!row;

  function fieldInput(f){
    const val = row ? row[f.key] : '';
    if(f.readonly){
      return `<input type="text" value="${esc(isEdit ? val : '(auto-generated)')}" disabled>`;
    }
    if(f.type==='select'){
      return `<select name="${f.key}">
        <option value=""></option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
    }
    if(f.type==='ref'){
      const opts = DATA[f.ref].map(r=>{
        const lbl = f.ref==='clients' ? `${r.id} — ${r.fullname}` : `${r.id} — ${r.address}`;
        return `<option value="${esc(r.id)}" ${val===r.id?'selected':''}>${esc(lbl)}</option>`;
      }).join('');
      return `<select name="${f.key}"><option value=""></option>${opts}</select>`;
    }
    if(f.type==='textarea'){
      return `<textarea name="${f.key}" rows="3">${esc(val)}</textarea>`;
    }
    if(f.type==='number'){
      const stepAttr = f.percent ? 'step="0.001"' : (f.step ? `step="${f.step}"` : 'step="any"');
      const displayVal = f.percent && val!==undefined && val!=='' ? (Number(val)*100) : val;
      return `<input type="number" ${stepAttr} name="${f.key}" value="${displayVal===undefined?'':esc(displayVal)}" ${f.percent?'data-percent="1"':''} placeholder="${f.percent?'e.g. 4.5 for 4.5%':''}">`;
    }
    if(f.type==='date'){
      return `<input type="date" name="${f.key}" value="${esc(val||'')}">`;
    }
    return `<input type="text" name="${f.key}" value="${esc(val||'')}" placeholder="${esc(f.placeholder||'')}">`;
  }

  const fieldsHtml = cfg.fields.map(f=>`
    <div class="field">
      <label>${esc(f.label)}${f.required?' *':''}</label>
      ${fieldInput(f)}
    </div>
  `).join('');

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h2>${isEdit ? 'Edit' : 'Add'} ${cfg.label}</h2>
        <div class="modal-sub">${isEdit ? 'Record ' + esc(existingId) : 'A new ID will be generated automatically.'}</div>
        <form id="entityForm">
          ${fieldsHtml}
          <div class="modal-actions">
            <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn">${isEdit ? 'Save changes' : 'Add ' + cfg.label}</button>
          </div>
        </form>
      </div>
    </div>
  `;

  const backdrop = document.getElementById('modalBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('entityForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const newRow = row ? {...row} : {id: nextId(entityKey)};
    cfg.fields.forEach(f=>{
      if(f.readonly) return;
      let v = fd.get(f.key);
      if(f.type==='number'){
        v = v===''||v===null ? '' : parseFloat(v);
        if(f.percent && v!=='') v = v/100;
      }
      newRow[f.key] = v;
    });
    // required check
    const missing = cfg.fields.filter(f=>f.required && !newRow[f.key]);
    if(missing.length){
      showToast('Please fill in: ' + missing.map(f=>f.label).join(', '));
      return;
    }
    if(isEdit){
      const idx = DATA[entityKey].findIndex(r=>r.id===existingId);
      DATA[entityKey][idx] = newRow;
      showToast(cfg.label + ' updated');
    }else{
      DATA[entityKey].push(newRow);
      showToast(cfg.label + ' added');
    }
    queueSave();
    closeModal();
    renderNav();
    renderApp();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function confirmDelete(entityKey, id){
  const cfg = ENTITIES[entityKey];
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="delBackdrop">
      <div class="modal" style="max-width:420px;">
        <h2>Delete ${esc(cfg.label.toLowerCase())} ${esc(id)}?</h2>
        <div class="modal-danger-note">This removes the record permanently from the shared ledger. This can't be undone.</div>
        <div class="modal-actions">
          <button class="btn secondary" id="delCancel">Cancel</button>
          <button class="btn danger" id="delConfirm" style="background:var(--terracotta);color:white;border-color:var(--terracotta);">Delete</button>
        </div>
      </div>
    </div>
  `;
  const backdrop = document.getElementById('delBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
  document.getElementById('delCancel').addEventListener('click', closeModal);
  document.getElementById('delConfirm').addEventListener('click', ()=>{
    DATA[entityKey] = DATA[entityKey].filter(r=>r.id!==id);
    queueSave();
    closeModal();
    showToast(cfg.label + ' deleted');
    renderNav();
    renderApp();
  });
}

/* ============================================================
   APP RENDER / ROUTER
   ============================================================ */
function renderApp(){
  const app = document.getElementById('app');
  if(!DATA){
    app.innerHTML = `<div class="empty-state">Loading ledger…</div>`;
    return;
  }
  if(activeSection==='dashboard'){
    app.innerHTML = renderDashboard();
    return;
  }
  app.innerHTML = renderTableSection(activeSection);

  const addBtn = document.getElementById('addBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>openModal(activeSection, null));

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      searchTerm = e.target.value;
      renderApp();
      // restore focus + caret after re-render
      const si = document.getElementById('searchInput');
      si.focus();
      si.setSelectionRange(si.value.length, si.value.length);
    });
  }
  const filterSelect = document.getElementById('filterSelect');
  if(filterSelect){
    filterSelect.addEventListener('change', (e)=>{
      filterValue = e.target.value;
      renderApp();
    });
  }
  app.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>openModal(activeSection, btn.dataset.edit));
  });
  app.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>confirmDelete(activeSection, btn.dataset.del));
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  // paint immediately with seed data so the app is never blank
  renderNav();
  renderApp();
  // then try to bring in any previously-saved changes
  try{
    await loadData();
    renderNav();
    renderApp();
  }catch(e){
    console.error('Init load error', e);
  }
})();
</script>
</body>
</html>
